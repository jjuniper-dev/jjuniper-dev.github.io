<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 556" width="1200" height="556" role="img"><rect width="1200" height="556" fill="#f8f8f5"/><text x="30" y="44.0" font-size="26" font-weight="700" fill="#1f2a25" text-anchor="start" font-family="Helvetica, Arial, sans-serif">From business need to enterprise outcome</text><text x="30" y="68.0" font-size="14" font-weight="400" fill="#66706b" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Six steps, one rule: the technology is chosen late, and the controls are chosen on purpose</text><rect x="30" y="110" width="168" height="190" rx="12" fill="#dbe8f7" stroke="#2f6db5" stroke-width="1.5"/><circle cx="56" cy="140" r="14" fill="#2f6db5"/><text x="56" y="145.0" font-size="14" font-weight="700" fill="#fff" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">1</text><text x="44" y="182.0" font-size="15" font-weight="700" fill="#2f6db5" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Business need</text><text x="44" y="214.0" font-size="12.5" font-weight="400" fill="#26302b" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Understand the</text><text x="44" y="229.6" font-size="12.5" font-weight="400" fill="#26302b" text-anchor="start" font-family="Helvetica, Arial, sans-serif">strategic or</text><text x="44" y="245.2" font-size="12.5" font-weight="400" fill="#26302b" text-anchor="start" font-family="Helvetica, Arial, sans-serif">operational need.</text><path d="M200 205 H214" stroke="#66706b" stroke-width="2" fill="none"/><path d="M212 199 L220 205 L212 211 z" fill="#66706b"/><rect x="222" y="110" width="168" height="190" rx="12" fill="#dcefdc" stroke="#3d8a45" stroke-width="1.5"/><circle cx="248" cy="140" r="14" fill="#3d8a45"/><text x="248" y="145.0" font-size="14" font-weight="700" fill="#fff" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">2</text><text x="236" y="182.0" font-size="15" font-weight="700" fill="#3d8a45" text-anchor="start" font-family="Helvetica, Arial, sans-serif">AI capability</text><text x="236" y="214.0" font-size="12.5" font-weight="400" fill="#26302b" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Define the capability</text><text x="236" y="229.6" font-size="12.5" font-weight="400" fill="#26302b" text-anchor="start" font-family="Helvetica, Arial, sans-serif">required to meet the</text><text x="236" y="245.2" font-size="12.5" font-weight="400" fill="#26302b" text-anchor="start" font-family="Helvetica, Arial, sans-serif">need.</text><path d="M392 205 H406" stroke="#66706b" stroke-width="2" fill="none"/><path d="M404 199 L412 205 L404 211 z" fill="#66706b"/><rect x="414" y="110" width="168" height="190" rx="12" fill="#e6defa" stroke="#6d4bc0" stroke-width="1.5"/><circle cx="440" cy="140" r="14" fill="#6d4bc0"/><text x="440" y="145.0" font-size="14" font-weight="700" fill="#fff" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">3</text><text x="428" y="182.0" font-size="15" font-weight="700" fill="#6d4bc0" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Solution pattern</text><text x="428" y="214.0" font-size="12.5" font-weight="400" fill="#26302b" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Select or design a</text><text x="428" y="229.6" font-size="12.5" font-weight="400" fill="#26302b" text-anchor="start" font-family="Helvetica, Arial, sans-serif">reusable pattern to</text><text x="428" y="245.2" font-size="12.5" font-weight="400" fill="#26302b" text-anchor="start" font-family="Helvetica, Arial, sans-serif">deliver it.</text><path d="M584 205 H598" stroke="#66706b" stroke-width="2" fill="none"/><path d="M596 199 L604 205 L596 211 z" fill="#66706b"/><rect x="606" y="110" width="168" height="190" rx="12" fill="#fbe5cf" stroke="#c9701c" stroke-width="1.5"/><circle cx="632" cy="140" r="14" fill="#c9701c"/><text x="632" y="145.0" font-size="14" font-weight="700" fill="#fff" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">4</text><text x="620" y="182.0" font-size="15" font-weight="700" fill="#c9701c" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Platform or</text><text x="620" y="200.0" font-size="15" font-weight="700" fill="#c9701c" text-anchor="start" font-family="Helvetica, Arial, sans-serif">technology</text><text x="620" y="232.0" font-size="12.5" font-weight="400" fill="#26302b" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Implement on the right</text><text x="620" y="247.6" font-size="12.5" font-weight="400" fill="#26302b" text-anchor="start" font-family="Helvetica, Arial, sans-serif">platform, at</text><text x="620" y="263.2" font-size="12.5" font-weight="400" fill="#26302b" text-anchor="start" font-family="Helvetica, Arial, sans-serif">enterprise scale.</text><path d="M776 205 H790" stroke="#66706b" stroke-width="2" fill="none"/><path d="M788 199 L796 205 L788 211 z" fill="#66706b"/><rect x="798" y="110" width="168" height="190" rx="12" fill="#d5eeee" stroke="#1f8a8a" stroke-width="1.5"/><circle cx="824" cy="140" r="14" fill="#1f8a8a"/><text x="824" y="145.0" font-size="14" font-weight="700" fill="#fff" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">5</text><text x="812" y="182.0" font-size="15" font-weight="700" fill="#1f8a8a" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Control pattern</text><text x="812" y="214.0" font-size="12.5" font-weight="400" fill="#26302b" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Apply governance,</text><text x="812" y="229.6" font-size="12.5" font-weight="400" fill="#26302b" text-anchor="start" font-family="Helvetica, Arial, sans-serif">security, risk and</text><text x="812" y="245.2" font-size="12.5" font-weight="400" fill="#26302b" text-anchor="start" font-family="Helvetica, Arial, sans-serif">assurance controls.</text><path d="M968 205 H982" stroke="#66706b" stroke-width="2" fill="none"/><path d="M980 199 L988 205 L980 211 z" fill="#66706b"/><rect x="990" y="110" width="168" height="190" rx="12" fill="#f7dde2" stroke="#b83a55" stroke-width="1.5"/><circle cx="1016" cy="140" r="14" fill="#b83a55"/><text x="1016" y="145.0" font-size="14" font-weight="700" fill="#fff" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">6</text><text x="1004" y="182.0" font-size="15" font-weight="700" fill="#b83a55" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Enterprise</text><text x="1004" y="200.0" font-size="15" font-weight="700" fill="#b83a55" text-anchor="start" font-family="Helvetica, Arial, sans-serif">outcome</text><text x="1004" y="232.0" font-size="12.5" font-weight="400" fill="#26302b" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Realize the value,</text><text x="1004" y="247.6" font-size="12.5" font-weight="400" fill="#26302b" text-anchor="start" font-family="Helvetica, Arial, sans-serif">measure it, keep</text><text x="1004" y="263.2" font-size="12.5" font-weight="400" fill="#26302b" text-anchor="start" font-family="Helvetica, Arial, sans-serif">improving.</text><path d="M690.0 316 V346 H114.0 V320" fill="none" stroke="#386557" stroke-width="1.8" stroke-dasharray="6 5"/><path d="M108.0 326 L114.0 314 L120.0 326 z" fill="#386557"/><rect x="300" y="334" width="600" height="24" rx="12" fill="#f8f8f5"/><text x="600.0" y="351.0" font-size="12.5" font-weight="600" fill="#386557" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">if the platform cannot meet the need, the need is not changed to fit the platform</text><rect x="30" y="390" width="270" height="44" rx="22" fill="#fff" stroke="#2f6db5" stroke-width="1.5"/><circle cx="54" cy="412" r="8" fill="#2f6db5"/><text x="72" y="417.0" font-size="14" font-weight="600" fill="#26302b" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Better decisions</text><rect x="318" y="390" width="270" height="44" rx="22" fill="#fff" stroke="#c9701c" stroke-width="1.5"/><circle cx="342" cy="412" r="8" fill="#c9701c"/><text x="360" y="417.0" font-size="14" font-weight="600" fill="#26302b" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Reduced risk</text><rect x="606" y="390" width="270" height="44" rx="22" fill="#fff" stroke="#3d8a45" stroke-width="1.5"/><circle cx="630" cy="412" r="8" fill="#3d8a45"/><text x="648" y="417.0" font-size="14" font-weight="600" fill="#26302b" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Improved outcomes</text><rect x="894" y="390" width="270" height="44" rx="22" fill="#fff" stroke="#6d4bc0" stroke-width="1.5"/><circle cx="918" cy="412" r="8" fill="#6d4bc0"/><text x="936" y="417.0" font-size="14" font-weight="600" fill="#26302b" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Sustainable value</text><rect x="30" y="452" width="1140" height="52" rx="12" fill="#dcebe3" stroke="#386557"/><text x="600.0" y="484.0" font-size="17" font-weight="700" fill="#386557" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">Enterprise AI works as a decision discipline, not simply as a technology deployment.</text><text x="600.0" y="544.0" font-size="12" font-weight="400" fill="#66706b" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">Illustrative pattern. Applies to any organization adopting AI at scale.</text></svg>