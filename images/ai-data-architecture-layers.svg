b" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">Analytics</text><rect x="270" y="300" width="660" height="92" rx="10" fill="#fbe5cf" stroke="#c9701c" stroke-width="1.5"/><circle cx="294" cy="326" r="13" fill="#c9701c"/><text x="294" y="331.0" font-size="14" font-weight="700" fill="#fff" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">3</text><text x="316" y="330.0" font-size="14" font-weight="700" fill="#c9701c" text-anchor="start" font-family="Helvetica, Arial, sans-serif">AI control and</text><text x="316" y="347.5" font-size="14" font-weight="700" fill="#c9701c" text-anchor="start" font-family="Helvetica, Arial, sans-serif">governance</text><text x="316" y="368.0" font-size="11.5" font-weight="400" fill="#4a5550" text-anchor="start" font-family="Helvetica, Arial, sans-serif">authority and evidence</text><rect x="466.0" y="316" width="106.5" height="60" rx="8" fill="#ffffff" stroke="#c9701c" stroke-opacity=".45"/><text x="519.25" y="350.0" font-size="12.5" font-weight="600" fill="#26302b" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">Model policy</text><rect x="580.5" y="316" width="106.5" height="60" rx="8" fill="#ffffff" stroke="#c9701c" stroke-opacity=".45"/><text x="633.75" y="350.0" font-size="12.5" font-weight="600" fill="#26302b" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">Evaluation</text><rect x="695.0" y="316" width="106.5" height="60" rx="8" fill="#ffffff" stroke="#c9701c" stroke-opacity=".45"/><text x="748.25" y="343.0" font-size="12.5" font-weight="600" fill="#26302b" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">Routing and</text><text x="748.25" y="358.0" font-size="12.5" font-weight="600" fill="#26302b" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">safety</text><rect x="809.5" y="316" width="106.5" height="60" rx="8" fill="#ffffff" stroke="#c9701c" stroke-opacity=".45"/><text x="862.75" y="343.0" font-size="12.5" font-weight="600" fill="#263