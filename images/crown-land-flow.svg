<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img" aria-labelledby="t d"><title id="t">Ontario Crown Land Explorer: from data to decision</title><desc id="d">Gather is partial: Easy access to authoritative Crown land data and personal, location-aware data. Combine is partial: One map and one decision plane. AI planned: matches my interests to land attributes. Explore is planned: Places to camp or hunt. Understand is partial: The land identified and explained. AI planned: explains it in plain language and cites the official source. A prototype.</desc><rect width="1200" height="500" fill="#f8f8f5"/><text x="30" y="44" font-size="26" font-weight="700" fill="#1f2a25" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Ontario Crown Land Explorer: from data to decision</text><text x="30" y="68" font-size="14" font-weight="400" fill="#66706b" text-anchor="start" font-family="Helvetica, Arial, sans-serif">A prototype. Official Crown land data and personal, location-aware data meet on one map; AI assistance is planned.</text><path d="M30 100 h256 l14 28 l-14 28 h-256 z" fill="#2f6db5"/><text x="165" y="120" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">1</text><text x="165" y="142" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">Gather</text><text x="30" y="176" font-size="10" font-weight="700" fill="#2f6db5" text-anchor="start" font-family="Helvetica, Arial, sans-serif">PARTIAL</text><rect x="30" y="186" width="270" height="104" rx="10" fill="#dbe8f7" stroke="#2f6db5" stroke-width="1.2" stroke-dasharray="16 4"/><text x="42" y="209" font-size="10" font-weight="700" fill="#2f6db5" text-anchor="start" font-family="Helvetica, Arial, sans-serif">THE QUESTION</text><text x="42" y="229" font-size="13" font-weight="400" fill="#26302b" text-anchor="start" font-family="Helvetica, Arial, sans-serif">What official data can I trust,</text><text x="42" y="246" font-size="13" font-weight="400" fill="#26302b" text-anchor="start" font-family="Helvetica, Arial, sans-serif">and what is mine?</text><rect x="30" y="302" width="270" height="132" rx="10" fill="#ffffff" stroke="#2f6db5" stroke-width="1.2" stroke-dasharray="16 4"/><text x="42" y="325" font-size="10" font-weight="700" fill="#2f6db5" text-anchor="start" font-family="Helvetica, Arial, sans-serif">THE OUTPUT</text><text x="42" y="345" font-size="13" font-weight="600" fill="#26302b" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Easy access to authoritative</text><text x="42" y="362" font-size="13" font-weight="600" fill="#26302b" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Crown land data and personal,</text><text x="42" y="379" font-size="13" font-weight="600" fill="#26302b" text-anchor="start" font-family="Helvetica, Arial, sans-serif">location-aware data</text><path d="M320 100 h256 l14 28 l-14 28 h-256 l14 -28 z" fill="#3d8a45"/><text x="455" y="120" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">2</text><text x="455" y="142" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">Combine</text><text x="320" y="176" font-size="10" font-weight="700" fill="#3d8a45" text-anchor="start" font-family="Helvetica, Arial, sans-serif">PARTIAL</text><rect x="556" y="164" width="34" height="16" rx="8" fill="#3d8a45"/><text x="573" y="175.5" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">AI</text><rect x="320" y="186" width="270" height="104" rx="10" fill="#dcefdc" stroke="#3d8a45" stroke-width="1.2" stroke-dasharray="16 4"/><text x="332" y="209" font-size="10" font-weight="700" fill="#3d8a45" text-anchor="start" font-family="Helvetica, Arial, sans-serif">THE QUESTION</text><text x="332" y="229" font-size="13" font-weight="400" fill="#26302b" text-anchor="start" font-family="Helvetica, Arial, sans-serif">How does my interest intersect</text><text x="332" y="246" font-size="13" font-weight="400" fill="#26302b" text-anchor="start" font-family="Helvetica, Arial, sans-serif">with Crown land?</text><rect x="320" y="302" width="270" height="132" rx="10" fill="#ffffff" stroke="#3d8a45" stroke-width="1.2" stroke-dasharray="16 4"/><text x="332" y="325" font-size="10" font-weight="700" fill="#3d8a45" text-anchor="start" font-family="Helvetica, Arial, sans-serif">THE OUTPUT</text><text x="332" y="345" font-size="13" font-weight="600" fill="#26302b" text-anchor="start" font-family="Helvetica, Arial, sans-serif">One map and one decision plane</text><text x="332" y="368" font-size="11.5" font-weight="400" font-style="italic" fill="#3d8a45" text-anchor="start" font-family="Helvetica, Arial, sans-serif">AI: matches my interests to land</text><text x="332" y="383" font-size="11.5" font-weight="400" font-style="italic" fill="#3d8a45" text-anchor="start" font-family="Helvetica, Arial, sans-serif">attributes</text><path d="M610 100 h256 l14 28 l-14 28 h-256 l14 -28 z" fill="#c9701c"/><text x="745" y="120" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">3</text><text x="745" y="142" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">Explore</text><text x="610" y="176" font-size="10" font-weight="700" fill="#66706b" text-anchor="start" font-family="Helvetica, Arial, sans-serif">PLANNED</text><rect x="610" y="186" width="270" height="104" rx="10" fill="#fbe5cf" stroke="#c9701c" stroke-width="1.2" stroke-dasharray="3 5"/><text x="622" y="209" font-size="10" font-weight="700" fill="#c9701c" text-anchor="start" font-family="Helvetica, Arial, sans-serif">THE QUESTION</text><text x="622" y="229" font-size="13" font-weight="400" fill="#26302b" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Where can I safely camp or hunt?</text><rect x="610" y="302" width="270" height="132" rx="10" fill="#ffffff" stroke="#c9701c" stroke-width="1.2" stroke-dasharray="3 5"/><text x="622" y="325" font-size="10" font-weight="700" fill="#c9701c" text-anchor="start" font-family="Helvetica, Arial, sans-serif">THE OUTPUT</text><text x="622" y="345" font-size="13" font-weight="600" fill="#26302b" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Places to camp or hunt</text><path d="M900 100 h256 l14 28 l-14 28 h-256 l14 -28 z" fill="#6d4bc0"/><text x="1035" y="120" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">4</text><text x="1035" y="142" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">Understand</text><text x="900" y="176" font-size="10" font-weight="700" fill="#6d4bc0" text-anchor="start" font-family="Helvetica, Arial, sans-serif">PARTIAL</text><rect x="1136" y="164" width="34" height="16" rx="8" fill="#6d4bc0"/><text x="1153" y="175.5" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">AI</text><rect x="900" y="186" width="270" height="104" rx="10" fill="#e8e0f7" stroke="#6d4bc0" stroke-width="1.2" stroke-dasharray="16 4"/><text x="912" y="209" font-size="10" font-weight="700" fill="#6d4bc0" text-anchor="start" font-family="Helvetica, Arial, sans-serif">THE QUESTION</text><text x="912" y="229" font-size="13" font-weight="400" fill="#26302b" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Where and what is this land?</text><rect x="900" y="302" width="270" height="132" rx="10" fill="#ffffff" stroke="#6d4bc0" stroke-width="1.2" stroke-dasharray="16 4"/><text x="912" y="325" font-size="10" font-weight="700" fill="#6d4bc0" text-anchor="start" font-family="Helvetica, Arial, sans-serif">THE OUTPUT</text><text x="912" y="345" font-size="13" font-weight="600" fill="#26302b" text-anchor="start" font-family="Helvetica, Arial, sans-serif">The land identified and</text><text x="912" y="362" font-size="13" font-weight="600" fill="#26302b" text-anchor="start" font-family="Helvetica, Arial, sans-serif">explained</text><text x="912" y="385" font-size="11.5" font-weight="400" font-style="italic" fill="#6d4bc0" text-anchor="start" font-family="Helvetica, Arial, sans-serif">AI: explains it in plain language</text><text x="912" y="400" font-size="11.5" font-weight="400" font-style="italic" fill="#6d4bc0" text-anchor="start" font-family="Helvetica, Arial, sans-serif">and cites the official source</text><text x="600.0" y="466" font-size="10.5" font-weight="400" fill="#66706b" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">Outline: solid = built, long dashes = partial, dotted = planned. AI tag = planned AI assistance.</text><text x="600.0" y="482" font-size="10.5" font-weight="400" fill="#66706b" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">Prototype. An illustrative flow; official sources and regulations remain authoritative.</text></svg>