<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 456" role="img" aria-labelledby="t d"><title id="t">Personal Cognitive Architecture: from capture to reuse</title><desc id="d">Capture is partial: Raw input from voice, notes, links, and documents. Validate is partial: Checked, structured knowledge. Govern is partial: Human approval for consequential actions. Reuse is partial: Retrieved context and agent actions. In development.</desc><rect width="1200" height="456" fill="#f8f8f5"/><text x="30" y="44" font-size="28" font-weight="700" fill="#1f2a25" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Personal Cognitive Architecture: from capture to reuse</text><text x="30" y="72" font-size="15" font-weight="400" fill="#4f5a55" text-anchor="start" font-family="Helvetica, Arial, sans-serif">In development. A governed, local-first personal AI platform, designed to keep consequential decisions under human control.</text><path d="M30 100 h256 l14 28 l-14 28 h-256 z" fill="#2f6db5"/><text x="165" y="119" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">1</text><text x="165" y="144" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">Capture</text><text x="30" y="177" font-size="12" font-weight="700" fill="#2f6db5" text-anchor="start" font-family="Helvetica, Arial, sans-serif">PARTIAL</text><rect x="30" y="186" width="270" height="88" rx="10" fill="#dbe8f7" stroke="#2f6db5" stroke-width="1.2" stroke-dasharray="16 4"/><text x="42" y="210" font-size="12" font-weight="700" fill="#2f6db5" text-anchor="start" font-family="Helvetica, Arial, sans-serif">THE QUESTION</text><text x="42" y="234" font-size="15" font-weight="400" fill="#26302b" text-anchor="start" font-family="Helvetica, Arial, sans-serif">What arrived?</text><rect x="30" y="286" width="270" height="92" rx="10" fill="#ffffff" stroke="#2f6db5" stroke-width="1.2" stroke-dasharray="16 4"/><text x="42" y="310" font-size="12" font-weight="700" fill="#2f6db5" text-anchor="start" font-family="Helvetica, Arial, sans-serif">THE OUTPUT</text><text x="42" y="334" font-size="15" font-weight="600" fill="#26302b" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Raw input from voice,</text><text x="42" y="354" font-size="15" font-weight="600" fill="#26302b" text-anchor="start" font-family="Helvetica, Arial, sans-serif">notes, links, and documents</text><path d="M320 100 h256 l14 28 l-14 28 h-256 l14 -28 z" fill="#3d8a45"/><text x="455" y="119" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">2</text><text x="455" y="144" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">Validate</text><text x="320" y="177" font-size="12" font-weight="700" fill="#3d8a45" text-anchor="start" font-family="Helvetica, Arial, sans-serif">PARTIAL</text><rect x="320" y="186" width="270" height="88" rx="10" fill="#dcefdc" stroke="#3d8a45" stroke-width="1.2" stroke-dasharray="16 4"/><text x="332" y="210" font-size="12" font-weight="700" fill="#3d8a45" text-anchor="start" font-family="Helvetica, Arial, sans-serif">THE QUESTION</text><text x="332" y="234" font-size="15" font-weight="400" fill="#26302b" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Can it be trusted?</text><rect x="320" y="286" width="270" height="92" rx="10" fill="#ffffff" stroke="#3d8a45" stroke-width="1.2" stroke-dasharray="16 4"/><text x="332" y="310" font-size="12" font-weight="700" fill="#3d8a45" text-anchor="start" font-family="Helvetica, Arial, sans-serif">THE OUTPUT</text><text x="332" y="334" font-size="15" font-weight="600" fill="#26302b" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Checked, structured</text><text x="332" y="354" font-size="15" font-weight="600" fill="#26302b" text-anchor="start" font-family="Helvetica, Arial, sans-serif">knowledge</text><path d="M610 100 h256 l14 28 l-14 28 h-256 l14 -28 z" fill="#c9701c"/><text x="745" y="119" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">3</text><text x="745" y="144" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">Govern</text><text x="610" y="177" font-size="12" font-weight="700" fill="#c9701c" text-anchor="start" font-family="Helvetica, Arial, sans-serif">PARTIAL</text><rect x="610" y="186" width="270" height="88" rx="10" fill="#fbe5cf" stroke="#c9701c" stroke-width="1.2" stroke-dasharray="16 4"/><text x="622" y="210" font-size="12" font-weight="700" fill="#c9701c" text-anchor="start" font-family="Helvetica, Arial, sans-serif">THE QUESTION</text><text x="622" y="234" font-size="15" font-weight="400" fill="#26302b" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Who decides?</text><rect x="610" y="286" width="270" height="92" rx="10" fill="#ffffff" stroke="#c9701c" stroke-width="1.2" stroke-dasharray="16 4"/><text x="622" y="310" font-size="12" font-weight="700" fill="#c9701c" text-anchor="start" font-family="Helvetica, Arial, sans-serif">THE OUTPUT</text><text x="622" y="334" font-size="15" font-weight="600" fill="#26302b" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Human approval for</text><text x="622" y="354" font-size="15" font-weight="600" fill="#26302b" text-anchor="start" font-family="Helvetica, Arial, sans-serif">consequential actions</text><path d="M900 100 h256 l14 28 l-14 28 h-256 l14 -28 z" fill="#6d4bc0"/><text x="1035" y="119" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">4</text><text x="1035" y="144" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">Reuse</text><text x="900" y="177" font-size="12" font-weight="700" fill="#6d4bc0" text-anchor="start" font-family="Helvetica, Arial, sans-serif">PARTIAL</text><rect x="900" y="186" width="270" height="88" rx="10" fill="#e8e0f7" stroke="#6d4bc0" stroke-width="1.2" stroke-dasharray="16 4"/><text x="912" y="210" font-size="12" font-weight="700" fill="#6d4bc0" text-anchor="start" font-family="Helvetica, Arial, sans-serif">THE QUESTION</text><text x="912" y="234" font-size="15" font-weight="400" fill="#26302b" text-anchor="start" font-family="Helvetica, Arial, sans-serif">What can be retrieved or</text><text x="912" y="254" font-size="15" font-weight="400" fill="#26302b" text-anchor="start" font-family="Helvetica, Arial, sans-serif">acted on?</text><rect x="900" y="286" width="270" height="92" rx="10" fill="#ffffff" stroke="#6d4bc0" stroke-width="1.2" stroke-dasharray="16 4"/><text x="912" y="310" font-size="12" font-weight="700" fill="#6d4bc0" text-anchor="start" font-family="Helvetica, Arial, sans-serif">THE OUTPUT</text><text x="912" y="334" font-size="15" font-weight="600" fill="#26302b" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Retrieved context and agent</text><text x="912" y="354" font-size="15" font-weight="600" fill="#26302b" text-anchor="start" font-family="Helvetica, Arial, sans-serif">actions</text><text x="600.0" y="412" font-size="12.5" font-weight="400" fill="#55605b" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">Outline: solid = built, long dashes = partial, dotted = planned.</text><text x="600.0" y="432" font-size="12.5" font-weight="400" fill="#55605b" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">An illustrative flow of the intended design. Not every stage is complete today.</text></svg>