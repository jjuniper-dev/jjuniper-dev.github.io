 font-family="Helvetica, Arial, sans-serif">Enterprise integration</text><circle cx="968" cy="606.8571428571429" r="3.5" fill="#5b6b64"/><text x="980" y="610.9" font-size="12.5" font-weight="400" fill="#26302b" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Non-functional</text><text x="980" y="626.5" font-size="12.5" font-weight="400" fill="#26302b" text-anchor="start" font-family="Helvetica, Arial, sans-serif">requirements</text><text x="600.0" y="722.0" font-size="12.5" font-weight="400" fill="#66706b" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">Generic reference view. Models and products sit inside the layers as replaceable parts; they are not the architecture.</text></svg>