<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="t d"><title id="t">Ontario Crown Land Explorer: from data to decision</title><desc id="d">Gather is partial: Easy access to authoritative Crown land data and personal, location-aware data. Combine is partial: One map and one decision plane. AI planned: matches my interests to land attributes. Explore is planned: Places to camp or hunt. Understand is partial: The land identified and explained. AI planned: explains it in plain language and cites the official source. A prototype.</desc><rect width="1200" height="560" fill="#f8f8f5"/><text x="30" y="44" font-size="28" font-weight="700" fill="#1f2a25" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Ontario Crown Land Explorer: from data to decision</text><text x="30" y="72" font-size="15" font-weight="400" fill="#4f5a55" text-anchor="start" font-family="Helvetica, Arial, sans-serif">A prototype. Official Crown land data and personal, location-aware data meet on one map; AI assistance is planned.</text><path d="M30 100 h256 l14 28 l-14 28 h-256 z" fill="#2f6db5"/><text x="165" y="119" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">1</text><text x="165" y="144" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">Gather</text><text x="30" y="177" font-size="12" font-weight="700" fill="#2f6db5" text-anchor="start" font-family="Helvetica, Arial, sans-serif">PARTIAL</text><rect x="30" y="186" width="270" height="88" rx="10" fill="#dbe8f7" stroke="#2f6db5" stroke-width="1.2" stroke-dasharray="16 4"/><text x="42" y="210" font-size="12" font-weight="700" fill="#2f6db5" text-anchor="start" font-family="Helvetica, Arial, sans-serif">THE QUESTION</text><text x="42" y="234" font-size="15" font-weight="400" fill="#26302b" text-anchor="start" font-family="Helvetica, Arial, sans-serif">What official data can I</text><text x="42" y="254" font-size="15" font-weight="400" fill="#26302b" text-anchor="start" font-family="Helvetica, Arial, sans-serif">trust, and what is mine?</text><rect x="30" y="286" width="270" height="196" rx="10" fill="#ffffff" stroke="#2f6db5" stroke-width="1.2" stroke-dasharray="16 4"/><text x="42" y="310" font-size="12" font-weight="700" fill="#2f6db5" text-anchor="start" font-family="Helvetica, Arial, sans-serif">THE OUTPUT</text><text x="42" y="334" font-size="15" font-weight="600" fill="#26302b" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Easy access to</text><text x="42" y="354" font-size="15" font-weight="600" fill="#26302b" text-anchor="start" font-family="Helvetica, Arial, sans-serif">authoritative Crown land</text><text x="42" y="374" font-size="15" font-weight="600" fill="#26302b" text-anchor="start" font-family="Helvetica, Arial, sans-serif">data and personal,</text><text x="42" y="394" font-size="15" font-weight="600" fill="#26302b" text-anchor="start" font-family="Helvetica, Arial, sans-serif">location-aware data</text><path d="M320 100 h256 l14 28 l-14 28 h-256 l14 -28 z" fill="#3d8a45"/><text x="455" y="119" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">2</text><text x="455" y="144" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">Combine</text><text x="320" y="177" font-size="12" font-weight="700" fill="#3d8a45" text-anchor="start" font-family="Helvetica, Arial, sans-serif">PARTIAL</text><rect x="552" y="163" width="38" height="18" rx="9" fill="#3d8a45"/><text x="571" y="176" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">AI</text><rect x="320" y="186" width="270" height="88" rx="10" fill="#dcefdc" stroke="#3d8a45" stroke-width="1.2" stroke-dasharray="16 4"/><text x="332" y="210" font-size="12" font-weight="700" fill="#3d8a45" t