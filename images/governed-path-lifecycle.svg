<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img"><rect width="1200" height="470" fill="#f8f8f5"/><text x="30" y="44.0" font-size="26" font-weight="700" fill="#1f2a25" text-anchor="start" font-family="Helvetica, Arial, sans-serif">A governed path from opportunity to operation</text><text x="30" y="68.0" font-size="14" font-weight="400" fill="#66706b" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Seven steps that every AI opportunity passes through, whatever the platform</text><rect x="26" y="100" width="148" height="130" rx="12" fill="#fff" stroke="#2f6db5" stroke-width="1.8"/><rect x="26" y="100" width="148" height="38" rx="12" fill="#2f6db5"/><rect x="26" y="124" width="148" height="14" fill="#2f6db5"/><text x="100.0" y="126.0" font-size="15" font-weight="700" fill="#fff" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">1  Assess</text><text x="100.0" y="168.0" font-size="12.5" font-weight="400" fill="#26302b" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">Is it a real need,</text><text x="100.0" y="183.6" font-size="12.5" font-weight="400" fill="#26302b" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">and is it ready?</text><path d="M175 165 H184" stroke="#66706b" stroke-width="2" fill="none"/><path d="M182 159 L190 165 L182 171 z" fill="#66706b"/><rect x="191" y="100" width="148" height="130" rx="12" fill="#fff" stroke="#3d8a45" stroke-width="1.8"/><rect x="191" y="100" width="148" height="38" rx="12" fill="#3d8a45"/><rect x="191" y="124" width="148" height="14" fill="#3d8a45"/><text x="265.0" y="126.0" font-size="15" font-weight="700" fill="#fff" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">2  Route</text><text x="265.0" y="168.0" font-size="12.5" font-weight="400" fill="#26302b" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">Reuse, extend or</text><text x="265.0" y="183.6" font-size="12.5" font-weight="400" fill="#26302b" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">build new?</text><path d="M340 165 H349" stroke="#66706b" stroke-width="2" fill="none"/><path d="M347 159 L355 165 L347 171 z" fill="#66706b"/><rect x="356" y="100" width="148" height="130" rx="12" fill="#fff" stroke="#c9701c" stroke-width="1.8"/><rect x="356" y="100" width="148" height="38" rx="12" fill="#c9701c"/><rect x="356" y="124" width="148" height="14" fill="#c9701c"/><text x="430.0" y="126.0" font-size="15" font-weight="700" fill="#fff" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">3  Govern</text><text x="430.0" y="168.0" font-size="12.5" font-weight="400" fill="#26302b" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">Which controls and</text><text x="430.0" y="183.6" font-size="12.5" font-weight="400" fill="#26302b" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">approvals apply?</text><path d="M505 165 H514" stroke="#66706b" stroke-width="2" fill="none"/><path d="M512 159 L520 165 L512 171 z" fill="#66706b"/><rect x="521" y="100" width="148" height="130" rx="12" fill="#fff" stroke="#6d4bc0" stroke-width="1.8"/><rect x="521" y="100" width="148" height="38" rx="12" fill="#6d4bc0"/><rect x="521" y="124" width="148" height="14" fill="#6d4bc0"/><text x="595.0" y="126.0" font-size="15" font-weight="700" fill="#fff" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">4  Build</text><text x="595.0" y="168.0" font-size="12.5" font-weight="400" fill="#26302b" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">Deliver on approved</text><text x="595.0" y="183.6" font-size="12.5" font-weight="400" fill="#26302b" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">patterns.</text><path d="M670 165 H679" stroke="#66706b" stroke-width="2" fill="none"/><path d="M677 159 L685 165 L677 171 z" fill="#66706b"/><rect x="686" y="100" width="148" height="130" rx="12" fill="#fff" stroke="#1f8a8a" stroke-width="1.8"/><rect x="686" y="100" width="148" height="38" rx="12" fill="#1f8a8a"/><rect x="686" y="124" width="148" height="14" fill="#1f8a8a"/><text x="760.0" y="126.0" font-size="15" font-weight="700" fill="#fff" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">5  Authorize</text><text x="760.0" y="168.0" font-size="12.5" font-weight="400" fill="#26302b" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">Confirm it may go</text><text x="760.0" y="183.6" font-size="12.5" font-weight="400" fill="#26302b" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">into service.</text><path d="M835 165 H844" stroke="#66706b" stroke-width="2" fill="none"/><path d="M842 159 L850 165 L842 171 z" fill="#66706b"/><rect x="851" y="100" width="148" height="130" rx="12" fill="#fff" stroke="#b83a55" stroke-width="1.8"/><rect x="851" y="100" width="148" height="38" rx="12" fill="#b83a55"/><rect x="851" y="124" width="148" height="14" fill="#b83a55"/><text x="925.0" y="126.0" font-size="15" font-weight="700" fill="#fff" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">6  Operate</text><text x="925.0" y="168.0" font-size="12.5" font-weight="400" fill="#26302b" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">Run, monitor and</text><text x="925.0" y="183.6" font-size="12.5" font-weight="400" fill="#26302b" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">support it.</text><path d="M1000 165 H1009" stroke="#66706b" stroke-width="2" fill="none"/><path d="M1007 159 L1015 165 L1007 171 z" fill="#66706b"/><rect x="1016" y="100" width="148" height="130" rx="12" fill="#fff" stroke="#386557" stroke-width="1.8"/><rect x="1016" y="100" width="148" height="38" rx="12" fill="#386557"/><rect x="1016" y="124" width="148" height="14" fill="#386557"/><text x="1090.0" y="126.0" font-size="15" font-weight="700" fill="#fff" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">7  Evolve</text><text x="1090.0" y="168.0" font-size="12.5" font-weight="400" fill="#26302b" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">Learn, improve,</text><text x="1090.0" y="183.6" font-size="12.5" font-weight="400" fill="#26302b" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">retire.</text><path d="M1090.0 246 V270 H100.0 V250" fill="none" stroke="#386557" stroke-width="1.8" stroke-dasharray="6 5"/><path d="M94.0 260 L100.0 248 L106.0 260 z" fill="#386557"/><rect x="420" y="258" width="360" height="24" rx="12" fill="#f8f8f5"/><text x="600.0" y="275.0" font-size="12.5" font-weight="600" fill="#386557" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">what operation teaches feeds the next assessment</text><text x="30" y="322.0" font-size="14" font-weight="700" fill="#1f2a25" text-anchor="start" font-family="Helvetica, Arial, sans-serif">The lifecycle keeps these aligned</text><rect x="30" y="336" width="150" height="40" rx="20" fill="#dcebe3" stroke="#386557"/><text x="105" y="361.0" font-size="13" font-weight="600" fill="#386557" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">Business priorities</text><rect x="193" y="336" width="150" height="40" rx="20" fill="#dcebe3" stroke="#386557"/><text x="268" y="361.0" font-size="13" font-weight="600" fill="#386557" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">Data</text><rect x="356" y="336" width="150" height="40" rx="20" fill="#dcebe3" stroke="#386557"/><text x="431" y="361.0" font-size="13" font-weight="600" fill="#386557" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">Platforms</text><rect x="519" y="336" width="150" height="40" rx="20" fill="#dcebe3" stroke="#386557"/><text x="594" y="361.0" font-size="13" font-weight="600" fill="#386557" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">Cyber security</text><rect x="682" y="336" width="150" height="40" rx="20" fill="#dcebe3" stroke="#386557"/><text x="757" y="361.0" font-size="13" font-weight="600" fill="#386557" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">Architecture</text><rect x="845" y="336" width="150" height="40" rx="20" fill="#dcebe3" stroke="#386557"/><text x="920" y="361.0" font-size="13" font-weight="600" fill="#386557" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">Resourcing</text><rect x="1008" y="336" width="150" height="40" rx="20" fill="#dcebe3" stroke="#386557"/><text x="1083" y="361.0" font-size="13" font-weight="600" fill="#386557" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">Investment</text><text x="600.0" y="458.0" font-size="12" font-weight="400" fill="#66706b" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">Illustrative pattern. Each step can be served by whichever tools and teams an organization already has.</text></svg>