.0" y="123.0" font-size="13.5" font-weight="700" fill="#fff" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">Design principles</text><circle cx="38" cy="156.0" r="3.5" fill="#386557"/><text x="50" y="160.0" font-size="12.5" font-weight="400" fill="#26302b" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Capability before</text><text x="50" y="175.6" font-size="12.5" font-weight="400" fill="#26302b" text-anchor="start" font-family="Helvetica, Arial, sans-serif">technology</text><circle cx="38" cy="231.14285714285714" r="3.5" fill="#386557"/><text x="50" y="235.1" font-size="12.5" font-weight="400" fill="#26302b" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Governance is explicit</text><circle cx="38" cy="306.2857142857143" r="3.5" fill="#386557"/><text x="50" y="310.3" font-size="12.5" font-weight="400" fill="#26302b" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Models are replaceable</text><text x="50" y="325.9" font-size="12.5" font-weight="400" fill="#26302b" text-anchor="start" font-family="Helvetica, Arial, sans-serif">components</text><circle cx="38" cy="381.42857142857144" r="3.5" fill="#386557"/><text x="50" y="385.4" font-size="12.5" font-weight="400" fill="#26302b" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Inherit shared controls</text><circle cx="38" cy="456.57142857142856" r="3.5" fill="#386557"/><text x="50" y="460.6" font-size="12.5" font-weight="400" fill="#26302b" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Human accountability</text><text x="50" y="476.2" font-size="12.5" font-weight="400" fill="#26302b" text-anchor="start" font-family="Helvetica, Arial, sans-serif">stays explicit</text><circle cx="38" cy="531.7142857142857" r="3.5" fill="#386557"/><text x="50" y="535.7" font-size="12.5" font-weight="400" fill="#26302b" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Evidence over assertion</text><circle cx="38" cy="606.8571428571