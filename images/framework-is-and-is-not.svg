<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" role="img"><rect width="1200" height="540" fill="#f8f8f5"/><text x="30" y="44.0" font-size="26" font-weight="700" fill="#1f2a25" text-anchor="start" font-family="Helvetica, Arial, sans-serif">What an enterprise AI framework is, and is not</text><text x="30" y="68.0" font-size="14" font-weight="400" fill="#66706b" text-anchor="start" font-family="Helvetica, Arial, sans-serif">It supplies the integration logic. The rest of the foundation is delivered by coordinated work products.</text><rect x="30" y="110" width="190" height="72" rx="10" fill="#dbe8f7" stroke="#2f6db5" stroke-width="1.3"/><text x="125" y="142.0" font-size="14" font-weight="600" fill="#26302b" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">AI strategy</text><rect x="240" y="110" width="190" height="72" rx="10" fill="#e6defa" stroke="#6d4bc0" stroke-width="1.3"/><text x="335" y="138.0" font-size="14" font-weight="600" fill="#26302b" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">Governance and</text><text x="335" y="155.0" font-size="14" font-weight="600" fill="#26302b" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">accountability</text><rect x="30" y="200" width="190" height="72" rx="10" fill="#dbe8f7" stroke="#2f6db5" stroke-width="1.3"/><text x="125" y="228.0" font-size="14" font-weight="600" fill="#26302b" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">Resourcing and</text><text x="125" y="245.0" font-size="14" font-weight="600" fill="#26302b" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">operating model</text><rect x="240" y="200" width="190" height="72" rx="10" fill="#e6defa" stroke="#6d4bc0" stroke-width="1.3"/><text x="335" y="228.0" font-size="14" font-weight="600" fill="#26302b" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">Implementation</text><text x="335" y="245.0" font-size="14" font-weight="600" fill="#26302b" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">roadmap</text><rect x="30" y="290" width="190" height="72" rx="10" fill="#dbe8f7" stroke="#2f6db5" stroke-width="1.3"/><text x="125" y="318.0" font-size="14" font-weight="600" fill="#26302b" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">Data architecture</text><text x="125" y="335.0" font-size="14" font-weight="600" fill="#26302b" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">and readiness</text><rect x="240" y="290" width="190" height="72" rx="10" fill="#e6defa" stroke="#6d4bc0" stroke-width="1.3"/><text x="335" y="318.0" font-size="14" font-weight="600" fill="#26302b" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">Platform and</text><text x="335" y="335.0" font-size="14" font-weight="600" fill="#26302b" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">DevSecOps</text><rect x="30" y="392" width="400" height="76" rx="14" fill="#dcebe3" stroke="#386557" stroke-width="2"/><text x="230" y="425.0" font-size="19" font-weight="700" fill="#386557" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">The framework</text><text x="230" y="449.0" font-size="14" font-weight="400" fill="#26302b" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">connects all six into one lifecycle</text><path d="M125 362 V392" stroke="#386557" stroke-width="2" stroke-dasharray="5 4"/><path d="M335 362 V392" stroke="#386557" stroke-width="2" stroke-dasharray="5 4"/><rect x="470" y="100" width="700" height="368" rx="12" fill="#fff" stroke="#d6dcd4"/><rect x="470" y="100" width="350.0" height="48" rx="12" fill="#386557"/><rect x="820.0" y="100" width="350.0" height="48" rx="12" fill="#a63a3a"/><rect x="808.0" y="100" width="12" height="48" fill="#386557"/><rect x="820.0" y="100" width="12" height="48" fill="#a63a3a"/><text x="645.0" y="131.0" font-size="18" font-weight="700" fill="#fff" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">It is</text><text x="995.0" y="131.0" font-size="18" font-weight="700" fill="#fff" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">It is not</text><circle cx="500" cy="188" r="13" fill="#386557"/><path d="M493 188 l5 5 l9 -10" stroke="#fff" stroke-width="2.6" fill="none"/><text x="524" y="184.0" font-size="14" font-weight="600" fill="#26302b" text-anchor="start" font-family="Helvetica, Arial, sans-serif">A common lifecycle for taking AI</text><text x="524" y="201.5" font-size="14" font-weight="600" fill="#26302b" text-anchor="start" font-family="Helvetica, Arial, sans-serif">from idea to operation</text><circle cx="850.0" cy="188" r="13" fill="#a63a3a"/><path d="M843.0 188 h14" stroke="#fff" stroke-width="2.8"/><text x="874.0" y="193.0" font-size="14" font-weight="600" fill="#26302b" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Not the AI strategy itself</text><path d="M480 228 H1160" stroke="#e1e5df"/><circle cx="500" cy="268" r="13" fill="#386557"/><path d="M493 268 l5 5 l9 -10" stroke="#fff" stroke-width="2.6" fill="none"/><text x="524" y="264.0" font-size="14" font-weight="600" fill="#26302b" text-anchor="start" font-family="Helvetica, Arial, sans-serif">A structure for making consistent</text><text x="524" y="281.5" font-size="14" font-weight="600" fill="#26302b" text-anchor="start" font-family="Helvetica, Arial, sans-serif">enterprise decisions</text><circle cx="850.0" cy="268" r="13" fill="#a63a3a"/><path d="M843.0 268 h14" stroke="#fff" stroke-width="2.8"/><text x="874.0" y="273.0" font-size="14" font-weight="600" fill="#26302b" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Not a single technology platform</text><path d="M480 308 H1160" stroke="#e1e5df"/><circle cx="500" cy="348" r="13" fill="#386557"/><path d="M493 348 l5 5 l9 -10" stroke="#fff" stroke-width="2.6" fill="none"/><text x="524" y="344.0" font-size="14" font-weight="600" fill="#26302b" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Reuse-first routing: use what</text><text x="524" y="361.5" font-size="14" font-weight="600" fill="#26302b" text-anchor="start" font-family="Helvetica, Arial, sans-serif">exists before building</text><circle cx="850.0" cy="348" r="13" fill="#a63a3a"/><path d="M843.0 348 h14" stroke="#fff" stroke-width="2.8"/><text x="874.0" y="353.0" font-size="14" font-weight="600" fill="#26302b" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Not the full investment plan</text><path d="M480 388 H1160" stroke="#e1e5df"/><circle cx="500" cy="428" r="13" fill="#386557"/><path d="M493 428 l5 5 l9 -10" stroke="#fff" stroke-width="2.6" fill="none"/><text x="524" y="424.0" font-size="14" font-weight="600" fill="#26302b" text-anchor="start" font-family="Helvetica, Arial, sans-serif">A governed path from demand to a</text><text x="524" y="441.5" font-size="14" font-weight="600" fill="#26302b" text-anchor="start" font-family="Helvetica, Arial, sans-serif">running service</text><circle cx="850.0" cy="428" r="13" fill="#a63a3a"/><path d="M843.0 428 h14" stroke="#fff" stroke-width="2.8"/><text x="874.0" y="433.0" font-size="14" font-weight="600" fill="#26302b" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Not an all-in-one deliverable</text><path d="M820.0 148 V468" stroke="#e1e5df"/><text x="600.0" y="526.0" font-size="12" font-weight="400" fill="#66706b" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">Illustrative pattern. Naming what a framework is not is as useful as naming what it is.</text></svg>